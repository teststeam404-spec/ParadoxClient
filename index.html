<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Client</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* shader-like background */
.bg {
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 20%, #6a5cff, transparent 40%),
              radial-gradient(circle at 80% 30%, #00d4ff, transparent 45%),
              radial-gradient(circle at 50% 80%, #ff4fd8, transparent 45%),
              radial-gradient(circle at 30% 60%, #00ff9d, transparent 50%);
  filter: blur(70px);
  animation: move 10s infinite alternate ease-in-out;
}

@keyframes move {
  0% { transform: translate(-10%, -10%) scale(1); }
  100% { transform: translate(-20%, -20%) scale(1.2); }
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.55);
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  top: 25%;
}

h1 {
  font-size: 45px;
}

p {
  opacity: 0.85;
  font-size: 18px;
}

.btn {
  display: inline-block;
  margin: 10px;
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  color: white;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  transition: 0.3s;
  text-decoration: none;
}

.btn:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,0.25);
}

.download {
  background: linear-gradient(90deg, #00ff9d, #00d4ff);
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
  <h1 id="title"></h1>
  <p id="text"></p>

  <a class="btn download" href="client.exe" download>
    Download Client
  </a>

  <div>
    <a class="btn" href="https://t.me/kimp1ntyao666" target="_blank">Telegram</a>
    <a class="btn" href="https://discord.gg/6U5Z4V92y" target="_blank">Discord</a>
  </div>
</div>

<script>
const lang = {
  ua: {
    title: "Мій Client 🚀",
    text: "Завантаж клієнт та приєднуйся до спільноти."
  },
  en: {
    title: "My Client 🚀",
    text: "Download the client and join the community."
  }
};

function setLang(l) {
  document.getElementById("title").innerText = lang[l].title;
  document.getElementById("text").innerText = lang[l].text;
  localStorage.setItem("lang", l);
}

window.onload = () => {
  setLang(localStorage.getItem("lang") || "ua");
};
</script>

</body>
</html>
