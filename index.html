<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParadoxClient</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  overflow-x: hidden;
}

/* background */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, #6a5cff, transparent 40%),
              radial-gradient(circle at 80% 30%, #00d4ff, transparent 45%),
              radial-gradient(circle at 50% 80%, #ff4fd8, transparent 45%);
  filter: blur(80px);
  animation: move 10s infinite alternate;
  z-index: -2;
}

@keyframes move {
  0% { transform: scale(1); }
  100% { transform: scale(1.2); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* layout */
.container {
  text-align: center;
  padding-top: 120px;
}

h1 {
  font-size: 50px;
}

p {
  max-width: 600px;
  margin: 10px auto;
  opacity: 0.85;
}

/* buttons */
.btn {
  display: inline-block;
  margin: 10px;
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.15);
}

.btn:hover {
  transform: scale(1.05);
}

.download {
  background: linear-gradient(90deg,#00ff9d,#00d4ff);
  color: black;
  font-weight: bold;
}

/* features */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 10px;
  max-width: 800px;
  margin: 40px auto;
}

.card {
  padding: 15px;
  background: rgba(255,255,255,0.1);
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
  <h1>ParadoxClient</h1>
  <p id="text"></p>

  <!-- REAL DOWNLOAD FIX -->
  <button class="btn download" onclick="downloadFile()">Download Client</button>

  <div>
    <button class="btn" onclick="setLang('ua')">UA</button>
    <button class="btn" onclick="setLang('en')">EN</button>
  </div>

  <div>
    <a class="btn" href="https://t.me/kimp1ntyao666" target="_blank">Telegram</a>
    <a class="btn" href="https://discord.gg/6U5Z4V92y" target="_blank">Discord</a>
  </div>
</div>

<div class="features">
  <div class="card" id="f1"></div>
  <div class="card" id="f2"></div>
  <div class="card" id="f3"></div>
  <div class="card" id="f4"></div>
</div>

<script>
const data = {
  ua: {
    text: "ParadoxClient — швидкий, оптимізований і красивий клієнт.",
    f1: "⚡ Optimization",
    f2: "🚀 Fast work",
    f3: "🎨 Good visuals",
    f4: "🧠 Best performance"
  },
  en: {
    text: "ParadoxClient — fast, optimized and visually clean client.",
    f1: "⚡ Optimization",
    f2: "🚀 Fast work",
    f3: "🎨 Good visuals",
    f4: "🧠 Best performance"
  }
};

function setLang(l) {
  document.getElementById("text").innerText = data[l].text;

  document.getElementById("f1").innerText = data[l].f1;
  document.getElementById("f2").innerText = data[l].f2;
  document.getElementById("f3").innerText = data[l].f3;
  document.getElementById("f4").innerText = data[l].f4;
}

/* REAL DOWNLOAD (100% WORKS) */
function downloadFile() {
  const a = document.createElement("a");
  a.href = "client.zip"; // поклади файл в ту ж папку
  a.download = "client.zip";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

window.onload = () => setLang("ua");
</script>

</body>
</html>
