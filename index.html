<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParadoxClient</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== BACKGROUND ===== */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #7c5cff, transparent 40%),
    radial-gradient(circle at 80% 30%, #00d4ff, transparent 45%),
    radial-gradient(circle at 50% 80%, #ff4fd8, transparent 45%),
    radial-gradient(circle at 30% 60%, #00ff9d, transparent 50%);
  filter: blur(85px);
  animation: move 12s infinite alternate ease-in-out;
  z-index: -2;
}

@keyframes move {
  0% { transform: scale(1) translate(-5%, -5%); }
  100% { transform: scale(1.25) translate(-10%, -10%); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* ===== NAV ===== */
nav {
  display: flex;
  justify-content: space-between;
  padding: 18px 25px;
  position: fixed;
  width: 100%;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.25);
}

.logo {
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 1px;
}

.lang button {
  margin-left: 8px;
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  color: white;
  transition: 0.3s;
}

.lang button:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.25);
}

/* ===== HERO ===== */
.hero {
  text-align: center;
  padding-top: 140px;
  padding-bottom: 50px;
}

.hero h1 {
  font-size: 54px;
}

.hero p {
  margin-top: 12px;
  font-size: 18px;
  opacity: 0.85;
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

/* ===== BUTTONS ===== */
.buttons {
  margin-top: 25px;
}

.btn {
  display: inline-block;
  margin: 10px;
  padding: 12px 18px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.12);
  transition: 0.3s;
  backdrop-filter: blur(10px);
}

.btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: rgba(255,255,255,0.25);
}

.primary {
  background: linear-gradient(90deg, #00ff9d, #00d4ff);
  color: black;
  font-weight: bold;
}

/* ===== FEATURES ===== */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

.card {
  padding: 18px;
  border-radius: 15px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
  background: rgba(255,255,255,0.15);
}

/* MOBILE */
@media (max-width: 700px) {
  .hero h1 { font-size: 38px; }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<!-- NAV -->
<nav>
  <div class="logo">ParadoxClient</div>
  <div class="lang">
    <button onclick="setLang('ua')">UA</button>
    <button onclick="setLang('en')">EN</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">

  </div>
</section>

<!-- FEATURES -->
<section class="features">
  <div class="card" id="f1"></div>
  <div class="card" id="f2"></div>
  <div class="card" id="f3"></div>
</section>
