<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParadoxClient</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b12;
    color:white;
}

/* background */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at 20% 20%, #7b2cff55, transparent 40%),
    radial-gradient(circle at 80% 30%, #9d4dff44, transparent 40%),
    radial-gradient(circle at 50% 80%, #5f00ff33, transparent 40%);
    z-index:-1;
    animation:move 6s infinite alternate;
}

@keyframes move{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

/* header */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    background:#111;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#a855ff;
}

nav a{
    color:white;
    margin:0 10px;
    text-decoration:none;
}

.lang{
    background:#7b2cff;
    border:none;
    padding:8px 12px;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* hero */
.hero{
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:50px;
}

.hero p{
    margin-top:10px;
    color:#ccc;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 30px;
    background:#7b2cff;
    color:white;
    text-decoration:none;
    border-radius:10px;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

/* features */
.features{
    padding:60px 10%;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:#181824;
    padding:20px;
    border-radius:12px;
}

/* community */
.community{
    padding:60px 10%;
    text-align:center;
}

footer{
    text-align:center;
    padding:20px;
    color:#888;
}
</style>
</head>

<div class="bg"></div>

    <nav>
        <a href="#features">Features</a>
        <a href="#community">Community</a>
    </nav>

    <button class="lang" onclick="toggleLang()">🇺🇦 / 🇬🇧</button>
</header>

<section class="hero">
    <h1 id="title">ParadoxClient</h1>
    <p id="desc">Сучасний клієнт із красивим інтерфейсом.</p>

    <a class="btn" id="downloadBtn" href="ParadoxClient%20Beta%202.5.zip" download>

</section>

<section class="features" id="features">

    <div class="grid">
        <div class="card">
            <h3>⚡ Fast</h3>

        </div>

        <div class="card">
            <h3>🎨 UI</h3>
            <p id="f2">Красивий дизайн</p>
        </div>

        <div class="card">
            <h3>🚀 Optimization</h3>
            <p id="f3">Оптимізація продуктивності</p>
        </div>

        <div class="card">
            <h3>🔒 Stability</h3>
            <p id="f4">Стабільна робота</p>
        </div>
    </div>
</section>

<section class="community" id="community">
    <h2 id="communityTitle">Community</h2>

    <a class="btn" href="https://t.me/kimp1ntyao666" target="_blank">
        Telegram
    </a>

    <a class="btn" href="https://discord.gg/6U5Z4V92y" target="_blank">
        Discord
    </a>
</section>

<footer>
    © ParadoxClient
</footer>
