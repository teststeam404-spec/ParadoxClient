<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Language Site</title>
<style>
/* ====== BACKGROUND (shader style) ====== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
  height: 100vh;
}

/* animated “Minecraft shader-like” background */
.bg {
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 20%, #4f9cff, transparent 40%),
              radial-gradient(circle at 80% 30%, #7a5cff, transparent 45%),
              radial-gradient(circle at 50% 80%, #00ffc8, transparent 40%),
              radial-gradient(circle at 30% 60%, #ff3df2, transparent 50%);
  filter: blur(60px);
  animation: moveBg 12s infinite alternate ease-in-out;
}

@keyframes moveBg {
  0% { transform: translate(-10%, -10%) scale(1); }
  100% { transform: translate(-20%, -20%) scale(1.2); }
}

/* dark overlay */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.55);
}

/* ====== UI ====== */
.container {
  position: relative;
  z-index: 2;
  text-align: center;
  top: 30%;
}

h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

p {
  font-size: 18px;
  opacity: 0.9;
}

button {
  padding: 10px 18px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

button:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
  <div>
    <button onclick="setLang('ua')">Українська</button>
    <button onclick="setLang('en')">English</button>
  </div>

  <h1 id="title"></h1>
  <p id="text"></p>
</div>

<script>
const lang = {
  ua: {
    title: "Привіт 👋",
    text: "Це сайт з перемиканням мов і красивим фоном як shader ефект."
  },
  en: {
    title: "Hello 👋",
    text: "This is a website with language switch and a shader-like animated background."
  }
};

function setLang(l) {
  document.getElementById("title").innerText = lang[l].title;
  document.getElementById("text").innerText = lang[l].text;
  localStorage.setItem("lang", l);
}

window.onload = () => {
  setLang(localStorage.getItem("lang") || "ua");
};
</script>

</body>
</html>
