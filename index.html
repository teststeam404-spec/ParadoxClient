<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParadoxClient</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

/* BACKGROUND */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, #7c5cff, transparent 40%),
    radial-gradient(circle at 80% 30%, #00d4ff, transparent 45%),
    radial-gradient(circle at 50% 80%, #ff4fd8, transparent 45%),
    radial-gradient(circle at 30% 60%, #00ff9d, transparent 50%);
  filter: blur(85px);
  animation: move 12s infinite alternate ease-in-out;
  z-index: -2;
}

@keyframes move {
  0% { transform: scale(1) translate(-5%, -5%); }
  100% { transform: scale(1.25) translate(-10%, -10%); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  padding: 18px 25px;
  position: fixed;
  width: 100%;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.25);
}

.logo {
  font-weight: bold;
  font-size: 18px;
}

/* HERO */
.hero {
  text-align: center;
  padding-top: 140px;
}

.hero h1 {
  font-size: 54px;
}

.hero p {
  margin-top: 10px;
  opacity: 0.85;
  max-width: 650px;
  margin-left: auto;
  margin-right: auto;
}

/* BUTTONS */
.btn {
  display: inline-block;
  margin: 10px;
  padding: 12px 18px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.12);
  transition: 0.3s;
  border: none;
  cursor: pointer;
  backdrop-filter: blur(10px);
}

.btn:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.25);
}

.primary {
  background: linear-gradient(90deg,#00ff9d,#00d4ff);
  color: black;
  font-weight: bold;
}

/* FEATURES */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 12px;
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  padding: 15px;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<nav>
  <div class="logo">ParadoxClient</div>
</nav>

<section class="hero">
  <h1>ParadoxClient</h1>
  <p id="text"></p>

  <div>
    <button class="btn primary" onclick="downloadClient()">Download Client</button>
    <a class="btn" href="https://t.me/kimp1ntyao666" target="_blank">Telegram</a>
    <a class="btn" href="https://discord.gg/6U5Z4V92y" target="_blank">Discord</a>
  </div>

  <div style="margin-top:10px;">
    <button class="btn" onclick="setLang('ua')">UA</button>
    <button class="btn" onclick="setLang('en')">EN</button>
  </div>
</section>

<section class="features">
  <div class="card" id="f1"></div>
  <div class="card" id="f2"></div>
  <div class="card" id="f3"></div>
  <div class="card" id="f4"></div>
</section>

<script>
const data = {
  ua: {
    text: "ParadoxClient — оптимізований клієнт з високою швидкістю, стабільністю та гарною візуальною системою.",
    f1: "⚡ Optimization system",
    f2: "🚀 Fast work",
    f3: "🎨 Very good visuals",
    f4: "🧠 High performance boost"
  },
  en: {
    text: "ParadoxClient — optimized client with speed, stability and modern visuals.",
    f1: "⚡ Optimization system",
    f2: "🚀 Fast work",
    f3: "🎨 Very good visuals",
    f4: "🧠 High performance boost"
  }
};

function setLang(l) {
  document.getElementById("text").innerText = data[l].text;
  document.getElementById("f1").innerText = data[l].f1;
  document.getElementById("f2").innerText = data[l].f2;
  document.getElementById("f3").innerText = data[l].f3;
  document.getElementById("f4").innerText = data[l].f4;
  localStorage.setItem("lang", l);
}

/* ✅ 100% WORKING DOWNLOAD FIX */
function downloadClient() {
  const url = "./client.zip"; // файл у root репозиторію

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error("File not found");
      return r.blob();
    })
