<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Landing</title>

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  color: white;
  background: black;
  overflow-x: hidden;
}

/* ===== SHADER BACKGROUND ===== */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 15% 20%, #6a5cff, transparent 40%),
              radial-gradient(circle at 85% 30%, #00d4ff, transparent 45%),
              radial-gradient(circle at 50% 80%, #ff4fd8, transparent 45%),
              radial-gradient(circle at 30% 60%, #00ff9d, transparent 50%);
  filter: blur(90px);
  animation: move 14s infinite alternate ease-in-out;
  z-index: -2;
}

@keyframes move {
  0% { transform: translate(-5%, -5%) scale(1); }
  100% { transform: translate(-12%, -10%) scale(1.25); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: -1;
}

/* ===== NAVBAR ===== */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  backdrop-filter: blur(12px);
  background: rgba(0,0,0,0.25);
  z-index: 10;
}

.logo {
  font-weight: bold;
  letter-spacing: 1px;
}

.lang button {
  margin-left: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  color: white;
  transition: 0.3s;
}

.lang button:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,0.25);
}

/* ===== HERO ===== */
.hero {
  text-align: center;
  padding-top: 140px;
  padding-bottom: 80px;
}

.hero h1 {
  font-size: 56px;
  margin-bottom: 15px;
  animation: fadeUp 1s ease forwards;
}

.hero p {
  font-size: 18px;
  opacity: 0.85;
  max-width: 650px;
  margin: auto;
  animation: fadeUp 1.3s ease forwards;
}

/* ===== BUTTONS ===== */
.buttons {
  margin-top: 25px;
}

.btn {
  display: inline-block;
  margin: 10px;
  padding: 13px 20px;
  border-radius: 14px;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

.btn:hover {
  transform: translateY(-4px) scale(1.05);
  background: rgba(255,255,255,0.22);
}

.glow {
  background: linear-gradient(90deg, #00ff9d, #00d4ff);
  color: black;
  font-weight: bold;
}

/* ===== FEATURES ===== */
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 50px 20px;
  max-width: 900px;
  margin: auto;
}

.card {
  padding: 20px;
  border-radius: 16px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  transition: 0.3s;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s forwards;
}

.card:hover {
  transform: translateY(-6px);
  background: rgba(255,255,255,0.15);
}

/* ===== ANIMATION ===== */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== MOBILE ===== */
@media (max-width: 700px) {
  .hero h1 {
    font-size: 38px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- NAV -->
<nav>

  <div class="lang">

  </div>

<!-- HERO -->
<section class="hero">

  <div class="buttons">
    <a class="btn glow" href="client.zip" download id="downloadBtn">Download</a>

    <a class="btn" href="https://discord.gg/6U5Z4V92y" target="_blank">Discord</a>
  </div>
</section>

<!-- FEATURES -->
<section class="features">
  <div class="card" id="f1"></div>
  <div class="card" id="f2"></div>
  <div class="card" id="f3"></div>
</section>
